# release-kit unified configuration
# Flat `key: value` with dot-namespace. '#' starts a comment.
# Read by publish_windows.ps1 and publish_*.sh.
# Secrets (keystore passwords etc.) come from env vars, never here.

# --- App info ---
app.name: myapp
app.bundleId: com.example.myapp
# (optional) single source image -> auto-generates all platform icons on publish
app.logo: assets/logo.png

# --- Build-time defines (injected via --dart-define) ---
build.dartDefine.SERVER_URL: https://api.example.com

# --- Output ---
output.dir: dist

# --- Windows hardening (optional, default off) ---
hardening.enabled: false
hardening.engineDll: core_engine.dll
hardening.assetDir: resources

# --- Android signing (passwords via env: ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD) ---
android.keystore: release/keystore.jks
android.keyAlias: myapp


